version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: recommendation-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recommendation_db
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [recommendation_network]

  redis:
    image: redis:7-alpine
    container_name: recommendation-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks: [recommendation_network]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: recommendation-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    ports: ["2379:2379", "2380:2380"]
    volumes: [etcd_data:/etcd-data]
    command: etcd -advertise-client-urls=http://recommendation-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --log-level warn
    networks: [recommendation_network]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  milvus:
    image: milvusdb/milvus:latest
    container_name: recommendation-milvus
    command: milvus run standalone
    environment:
      COMMON_STORAGETYPE: local
      ETCD_ENDPOINTS: recommendation-etcd:2379
    ports: ["19530:19530", "9091:9091"]
    volumes: [milvus_data:/var/lib/milvus]
    networks: [recommendation_network]
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  milvus_data:
  redis_data:
  etcd_data:

networks:
  recommendation_network:
    driver: bridge